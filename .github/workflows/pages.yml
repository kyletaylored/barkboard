name: Build & Deploy Browser Flasher

# Builds the firmware, drops the binaries into docs/ alongside the ESP Web
# Tools page (docs/flash/index.html + docs/manifest.json — the flasher was
# split out to its own subpage from a new docs/index.html marketing landing
# page; see the commit that did that split for why), and deploys docs/ to
# GitHub Pages via the modern actions/deploy-pages flow.
#
# This is intentionally a SEPARATE workflow from build.yml (the compile-check
# CI) — that one stays untouched. This one additionally publishes artifacts.
#
# One-time setup a human still needs to do in the repo's GitHub settings
# (cannot be done from a workflow file or a sandboxed agent):
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# Without that toggle, this workflow will build successfully but the
# deploy-pages step will fail (Pages isn't provisioned to accept it yet).
#
# Trigger: every push to main — this workflow only ever republishes the
# "latest main" build at docs/'s root paths (manifest.json, firmware.bin,
# etc.), which is what the flasher's version picker calls "Latest (main)".
# Tagged releases are a separate concern, handled by release.yml: pushing a
# vX.Y.Z tag builds + publishes a versioned copy under docs/versions/<tag>/,
# updates docs/versions.json (which is what populates the rest of the
# picker), and does its own Pages deploy in the same run — see that file for
# why it can't just rely on this one picking up its commit automatically.

# Path filters keep this from redeploying on doc-only commits (README/plan/
# design edits) — only firmware-affecting files or the flasher page's own
# template files trigger a rebuild+redeploy.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "assets/**"
      - "platformio.ini"
      - "docs/index.html"
      - "docs/flash/index.html"
      - "docs/assets/**"
      - "docs/manifest.json"
      - "docs/versions.json"
      - "sim/**"
      - "!sim/vendor/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          # Full history + tags — see build.yml's identical step for why:
          # tools/get_version.py's `git describe --tags` needs real tag data,
          # which the default shallow clone doesn't have.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware (cyd environment)
        run: pio run -e cyd

      - name: Copy binaries into docs/
        run: |
          set -eu
          BUILD_DIR=.pio/build/cyd
          cp "$BUILD_DIR/bootloader.bin" docs/bootloader.bin
          cp "$BUILD_DIR/partitions.bin" docs/partitions.bin
          cp "$BUILD_DIR/firmware.bin" docs/firmware.bin

          # boot_app0.bin isn't produced in the build dir — it ships inside
          # the Arduino ESP32 framework package itself. Locate it the same
          # way idedata.json's flash_images list does, rather than
          # hardcoding a package version.
          BOOT_APP0=$(find ~/.platformio/packages -type f -name boot_app0.bin | head -n1)
          if [ -z "$BOOT_APP0" ]; then
            echo "Could not locate boot_app0.bin in ~/.platformio/packages" >&2
            exit 1
          fi
          cp "$BOOT_APP0" docs/boot_app0.bin

      - name: Write manifest.json for this build
        run: |
          set -eu
          VERSION=$(git describe --tags --always --dirty)
          echo "version: $VERSION"
          # Generated from scratch every run, same as release.yml's per-version
          # manifest — this used to just *stamp* the version field into an
          # already-tracked docs/manifest.json, which broke the moment that
          # file stopped being tracked (it's build output now, like the
          # .bin's above; see the commit that untracked it) since there was
          # nothing left to load and stamp. Generating it here removes that
          # "must already exist in the checkout" assumption entirely.
          python3 -c "
          import json
          manifest = {
              'name': 'BarkBoard',
              'version': '$VERSION',
              'new_install_prompt_erase': True,
              'builds': [
                  {
                      'chipFamily': 'ESP32',
                      'parts': [
                          {'path': 'bootloader.bin', 'offset': 4096},
                          {'path': 'partitions.bin', 'offset': 32768},
                          {'path': 'boot_app0.bin', 'offset': 57344},
                          {'path': 'firmware.bin', 'offset': 65536},
                      ],
                  }
              ],
          }
          with open('docs/manifest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
              f.write('\n')
          "

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Fetch sim/vendor (LVGL + lv_drivers, gitignored — see sim/README.md)
        run: |
          set -eu
          git clone --depth 1 --branch v8.3.11 https://github.com/lvgl/lvgl.git sim/vendor/lvgl
          git clone --depth 1 --branch release/v8.3 https://github.com/lvgl/lv_drivers.git sim/vendor/lv_drivers

      - name: Pre-build Emscripten's SDL2 port (avoids a -j race)
        # embuilder does this itself the first time any emcc invocation
        # needs -sUSE_SDL=2 against a cold cache — but Makefile.wasm's `-j`
        # spawns many emcc processes at once, and they'll all try to
        # fetch/rebuild the port's shared cache dir concurrently, racing on
        # `shutil.rmtree` ("OSError: [Errno 39] Directory not empty").
        # One serial build here populates the cache before any parallel
        # compile touches it. Not needed for local dev — a dev machine's
        # cache is normally already warm from an earlier build.
        run: embuilder build sdl2

      - name: Build WASM simulator for the flasher page's Live Demo
        run: make -C sim -f Makefile.wasm -j

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
