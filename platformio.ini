; BarkBoard — Datadog CYD Dashboard
; Target: ESP32-2432S028 (ESP32-32E, 2.8" resistive touch, 240x320, ILI9341_2).
; Modeled on justynroberts/pagerduty-cyd's platformio.ini (see _reference/),
; but the display driver flags were corrected against
; witnessmenow/ESP32-Cheap-Yellow-Display's verified User_Setup.h after the
; reference project's ST7789 assumption turned out not to match this unit —
; see the TFT_eSPI comment block below for exactly what changed and why.

[env:cyd]
; 7.0.1, not 6.7.0 — verified live this still bundles the same Arduino-ESP32
; core generation (2.0.16 -> 2.0.17, a patch release, both on IDF v4.4.7),
; so the LEDC PWM core-2.0.x quirks documented elsewhere in this repo still
; apply unchanged. A real core-3.x/IDF5 jump would mean switching to the
; community pioarduino/platform-espressif32 fork entirely, not just bumping
; this version — deliberately not done here.
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; Update these to match your machine/board once you plug it in:
upload_port = /dev/cu.usbserial-110
monitor_port = /dev/cu.usbserial-110
monitor_filters = esp32_exception_decoder, time

board_build.partitions = huge_app.csv
board_build.filesystem = littlefs

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    ; 8.4.0, not 8.3.11 — latest release on the 8.x line (last one before
    ; LVGL 9's breaking API changes). LVGL 9 would need a dedicated
    ; migration across all of ui.cpp's ~2000 lines, not a version bump —
    ; deliberately not done here.
    lvgl/lvgl@~8.4.0
    ; Pinned to the latest tag (v1.4), not tracking git HEAD/master anymore —
    ; removes upstream-drift risk for no behavior change (this repo already
    ; uses what v1.4 ships).
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    bblanchon/ArduinoJson@^7.4.3
    ; NOTE: the pagerduty-cyd reference project's platformio.ini lists
    ; tzapu/WiFiManager as a dependency, but its src/wifi_setup.cpp never
    ; includes or calls it (the README explains they replaced it with a
    ; hand-rolled WebServer + DNSServer captive portal). That's stale cruft
    ; from before the rewrite — deliberately NOT carried over here.
    ; If you ever need QR generation outside LVGL's built-in lv_qrcode
    ; widget (see include/lv_conf.h), ricmoo/QRCode is the well-precedented
    ; header-only alternative:
    ; ricmoo/QRCode@^0.0.1

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM=0
    ; ----- ArduinoJson -----
    ; Default nesting limit is 10 (ArduinoJson/Configuration.hpp) — confirmed
    ; live this is too shallow: /api/v2/incidents/search's real response
    ; nests exactly 10 deep just to reach a populated commander's name
    ; (data.attributes.incidents[].data.attributes.commander.data.
    ; attributes.name), which sits right at the limit and fails with
    ; "json: TooDeep" the moment a real commander is actually assigned —
    ; confirmed live on real hardware, not a hypothetical.
    -D ARDUINOJSON_DEFAULT_NESTING_LIMIT=20
    ; ----- LVGL -----
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    ; ----- TFT_eSPI: ESP32-2432S028 (ESP32-32E), matched exactly against -----
    ; witnessmenow/ESP32-Cheap-Yellow-Display's verified-working
    ; DisplayConfig/User_Setup.h — the actively-maintained community
    ; reference for this specific board. Two corrections from what this repo
    ; assumed earlier (both would independently cause a permanently blank
    ; white panel — backlight on, controller never leaves its uninitialized
    ; state — regardless of what's drawn):
    ;   1. Driver is ILI9341_2 (alternate ILI9341 init sequence), not ST7789.
    ;      Sending ST7789 init commands to an ILI9341 panel means it never
    ;      properly initializes.
    ;   2. USE_HSPI_PORT is required. Without it, TFT_eSPI defaults to VSPI
    ;      on plain ESP32 — the SAME peripheral display.cpp's touchSpi
    ;      explicitly claims via SPIClass(VSPI). Two SPI buses fighting over
    ;      one physical peripheral with different pin sets is a real
    ;      hardware conflict, not just a config nit.
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D USE_HSPI_PORT
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
