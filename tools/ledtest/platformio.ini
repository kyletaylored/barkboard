; Standalone sanity-check project — NOT part of the main BarkBoard build.
; Flashes witnessmenow/ESP32-Cheap-Yellow-Display's own minimal RGB LED test
; (mirrored in _reference/ESP32-Cheap-Yellow-Display/Examples/Basics/6-LEDTest,
; copied verbatim into src/main.cpp here) with zero WiFi/LVGL/TFT_eSPI in the
; way, to answer one question: does the onboard LED light up at all on this
; board, independent of anything BarkBoard's own firmware does. See
; `make flash-ledtest` in the repo root Makefile.
[env:cyd]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
